name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: kubeconform-ci
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends shellcheck
      - name: Shellcheck
        run: shellcheck scripts/*.sh tests/integration.sh

  unit:
    runs-on: kubeconform-ci
    steps:
      - uses: actions/checkout@v4
      - name: Install bats + jq
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends bats jq
      - name: Run unit tests
        run: bats tests/

  integration:
    runs-on: kubeconform-ci
    env:
      KUBECONFORM_VERSION: "0.6.7"
      KUSTOMIZE_VERSION: "5.4.3"
    steps:
      - uses: actions/checkout@v4
      - name: Install jq + tools
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends jq curl ca-certificates tar
      - name: Install kubeconform + kustomize
        run: |
          set -eux
          arch="$(uname -m)"; case "$arch" in x86_64) arch=amd64;; aarch64|arm64) arch=arm64;; esac
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-${arch}.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_${arch}.tar.gz" \
            | tar -xz -C /usr/local/bin kustomize
          kubeconform -v && kustomize version
      - name: Run integration suite
        run: bash tests/integration.sh

  action-selftest:
    runs-on: kubeconform-ci
    steps:
      - uses: actions/checkout@v4
      - name: Install curl + jq for the composite action
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends jq curl ca-certificates tar
      - name: Validate the example manifests via this action
        uses: ./
        with:
          dirs: examples/manifests
          kubernetes-version: '1.30'
      - name: Validate the manifests + kustomize overlay via this action
        uses: ./
        with:
          dirs: |
            examples/manifests
            examples/kustomize
          kubernetes-version: '1.30'
