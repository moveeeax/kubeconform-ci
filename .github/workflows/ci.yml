name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install shellcheck
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Shellcheck
        run: shellcheck scripts/*.sh tests/integration.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install bats + jq
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats jq
      - name: Run unit tests
        run: bats tests/

  integration:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: "0.8.0"
      KUSTOMIZE_VERSION: "5.8.3"
      HELM_VERSION: "3.22.1"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install jq + tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq curl ca-certificates tar
      - name: Install kubeconform + kustomize + helm
        run: |
          set -eux
          arch="$(uname -m)"; case "$arch" in x86_64) arch=amd64;; aarch64|arm64) arch=arm64;; esac
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-${arch}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_${arch}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kustomize
          curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-${arch}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 "linux-${arch}/helm"
          kubeconform -v && kustomize version && helm version --short
      - name: Run integration suite
        run: bash tests/integration.sh

  action-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install curl + jq for the composite action
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq curl ca-certificates tar
      - name: Validate the example manifests via this action
        uses: ./
        with:
          dirs: examples/manifests
          kubernetes-version: '1.30'
      - name: Validate the manifests + kustomize overlay via this action
        uses: ./
        with:
          dirs: |
            examples/manifests
            examples/kustomize
          kubernetes-version: '1.30'

  action-render-install:
    # kustomize-version / helm-version must install those tools and put them
    # first on PATH, and the requested rendering must then run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install curl + jq for the composite action
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq curl ca-certificates tar
      - name: Render the kustomize overlay and helm chart via this action
        uses: ./
        with:
          dirs: |
            examples/manifests
            examples/kustomize
          kubernetes-version: '1.30'
          kustomize: 'true'
          kustomize-version: '5.8.3'
          helm-charts: examples/helm/web
          helm-version: '3.22.1'
      - name: Check the requested versions are the ones on PATH
        run: |
          set -eux
          test "$(command -v kustomize)" = "${HOME}/.kubeconform-ci/bin/kustomize"
          test "$(kustomize version)" = "v5.8.3"
          test "$(command -v helm)" = "${HOME}/.kubeconform-ci/bin/helm"
          test "$(helm version --template '{{.Version}}')" = "v3.22.1"

  action-version-pin:
    # kubeconform-version must win over a kubeconform that is already on PATH.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Put a different kubeconform on PATH
        run: |
          set -eux
          arch="$(uname -m)"; case "$arch" in x86_64) arch=amd64;; aarch64|arm64) arch=arm64;; esac
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-${arch}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          test "$(kubeconform -v)" = "v0.8.0"
      - name: Run the action with an explicit kubeconform-version
        uses: ./
        with:
          dirs: examples/manifests
          kubernetes-version: '1.30'
          kubeconform-version: '0.7.0'
      - name: Check the requested version is the one on PATH
        run: |
          set -eux
          command -v kubeconform
          test "$(kubeconform -v)" = "v0.7.0"
